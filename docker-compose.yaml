services:
  waha:
    image: devlikeapro/waha:latest
    container_name: Ai_agent_biologicalAgents_waha
    restart: always
    ports:
      - '3000:3000'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wpp_agent_api
    ports:
      - '8000:8000'
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload