version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: app
    restart: always
    ports:
      - "80:80"   # porta pública
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=xxx
      - WAHA_DASHBOARD_PASSWORD=xxx
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - SCHEDULE_TIME=09:00
      - TZ=America/Sao_Paulo

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: send_daily_reminders
    depends_on:
      - app
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      - WAHA_URL=http://app:3000
      - SCHEDULE_TIME=09:00
      - TZ=America/Sao_Paulo
    restart: always
