services:

  waha:
    image: devlikeapro/waha:latest
    container_name: Ai_agent_biologicalAgents_waha
    restart: always

    ports:
      - '3000:3000'
    environment:
      - WHATSAPP_HOOK_URL=http://api:8000/agent/webhook/
      - WHATSAPP_HOOK_EVENTS=message

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wpp_agent_api
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: send_daily_reminders
    depends_on:
      - waha
      - api
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      # WAHA_URL can be overridden to point to a different host/IP where the waha service is reachable.
      - WAHA_URL=http://waha:3000
      # Time to run the daily job (HH:MM 24-hour). Default: 09:00
      - SCHEDULE_TIME=09:00
      # - SCHEDULE_INTERVAL_MINUTES=2
      - TZ=America/Sao_Paulo
    restart: always

