services:

  waha:
    image: devlikeapro/waha:latest
    container_name: Ai_agent_biologicalAgents_waha
    restart: always
    expose:
      - "3000"

    ports:
      - '3000:3000'
    environment:
      - WHATSAPP_HOOK_URL=https://agentaibiologicalagents-production.up.railway.app/agent/webhook/
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_DASHBOARD_ENABLED=true
      - WAHA_DASHBOARD_USERNAME=agent_ai!
      - WAHA_DASHBOARD_PASSWORD=Agent_ai123!
    

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: wpp_agent_api
    ports:
      - '8000:8000'
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: send_daily_reminders
    depends_on:
      - waha
      - api
    volumes:
      - .:/app
      - ./chroma_data:/app/chroma_data
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
      # WAHA_URL can be overridden to point to a different host/IP where the waha service is reachable.
      - WAHA_URL=http://waha:3000
      # Time to run the daily job (HH:MM 24-hour). Default: 09:00
      - SCHEDULE_TIME=09:00
      # - SCHEDULE_INTERVAL_MINUTES=2
      - TZ=America/Sao_Paulo
    restart: always
proxy:
    image: nginx:latest
    container_name: reverse_proxy
    restart: always
    ports:
      - '80:80'
    depends_on:
      - waha
      - api
    ports:
      - "80:80"   # porta pública
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
